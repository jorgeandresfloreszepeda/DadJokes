name: Deploy to GitHub Pages

# Deploys on every push to main, or manually from the Actions tab
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissions required by GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 1. Prepare site
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Copy only the site files
        run: |
          mkdir _site
          cp index.html script.js jokes.json users.json _site/
          cp -r pages _site/
          echo "Files to publish:"
          ls -R _site

      - name: Upload site package
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 2. Publish
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Done
        run: echo "🎉 Site published at ${{ steps.deployment.outputs.page_url }}"
