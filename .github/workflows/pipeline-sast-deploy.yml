name: SAST + Deploy to GitHub Pages

# Runs SAST weekly, and manually.
# The site is only published if the SAST jobs succeed (push to main / manual run).
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC: catches newly disclosed vulnerability patterns
  workflow_dispatch:

# Least privilege by default; jobs raise permissions only where needed
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # SAST 1: CodeQL (GitHub native). Results appear in Security > Code scanning
  # ---------------------------------------------------------------
  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload results to Code scanning
      actions: read
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript   # covers script.js and inline JS
          queries: security-and-quality
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ---------------------------------------------------------------
  # SAST 2: Semgrep (OSS rules, no account needed). Complements CodeQL
  # ---------------------------------------------------------------
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Run Semgrep (fails the job on findings)
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/default \
            --config p/javascript \
            --config p/secrets \
            --sarif --output semgrep.sarif

      - name: Upload SARIF to Code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------
  # Build: same as the original pipeline, but only after SAST passes
  # ---------------------------------------------------------------
  build:
    name: 1. Prepare site
    if: github.event_name != 'pull_request'
    needs: [codeql, semgrep]
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Copy only the site files
        run: |
          mkdir _site
          cp index.html script.js jokes.json users.json _site/
          cp -r pages _site/
          echo "Files to publish:"
          ls -R _site

      - name: Upload site package
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 2. Publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    # Only one deployment at a time (scoped to this job so PR scans never block it)
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Done
        run: echo "🎉 Site published at ${{ steps.deployment.outputs.page_url }}"
