name: Demo Pipeline

# Runs on every push and every pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Build message
        run: |
          echo "🔨 Starting build..."
          echo "Project: Chistes de Papá"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
          echo "✅ Build finished (simulated)"

      - name: Show project files
        run: ls -R

  test:
    name: 2. Test
    runs-on: ubuntu-latest
    needs: build        # waits for the build job to succeed
    steps:
      - name: Test message
        run: |
          echo "🧪 Running tests..."
          echo "Test 1: index.html loads... OK"
          echo "Test 2: menu links work... OK"
          echo "Test 3: jokes.json is valid... OK"
          echo "✅ All tests passed (simulated)"

  deploy:
    name: 3. Deploy
    runs-on: ubuntu-latest
    needs: test         # waits for the test job to succeed
    steps:
      - name: Deploy message
        run: |
          echo "🚀 Deploying..."
          echo "No real server is used in this demo."
          echo "🎉 Pipeline finished successfully (simulated)"